<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bsGoldIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="bsSlateIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#bsSlateIcon)" />
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="url(#bsGoldIcon)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Bhumi Sambhara Stupa & Career Upward Diamond Iconography -->
  <!-- Tier 1: Base Terrace -->
  <path d="M 24 76 L 76 76 L 72 70 L 28 70 Z" fill="url(#bsGoldIcon)" fill-opacity="0.85" />
  
  <!-- Tier 2: Middle Terrace -->
  <path d="M 30 68 L 70 68 L 66 62 L 34 62 Z" fill="url(#bsGoldIcon)" fill-opacity="0.9" />
  
  <!-- Tier 3: Upper Circular Terrace -->
  <path d="M 36 60 L 64 60 L 60 54 L 40 54 Z" fill="url(#bsGoldIcon)" />

  <!-- Central Diamond & Spire (Ascending Career Pinnacle) -->
  <path d="M 50 18 L 56 36 L 50 48 L 44 36 Z" fill="url(#bsGoldIcon)" />
  <circle cx="50" cy="18" r="3" fill="#FDE68A" />
  
  <circle cx="36" cy="48" r="4.5" fill="none" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="64" cy="48" r="4.5" fill="none" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="50" cy="48" r="5" fill="#FDE68A" />

  <!-- Career Elevation Rays -->
  <line x1="22" y1="50" x2="16" y2="50" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="78" y1="50" x2="84" y2="50" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
</svg>
