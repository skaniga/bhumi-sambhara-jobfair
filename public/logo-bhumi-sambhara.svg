<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <!-- Royal Amber Gradient reminiscent of Borobudur stone at sunrise -->
    <linearGradient id="bsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="bsSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Emblem Container -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#bsSlate)" filter="url(#subtleGlow)" />
    
    <!-- Outer Precision Guilloche Ring -->
    <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="url(#bsGold)" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Bhumi Sambhara Stupa & Career Upward Diamond Iconography -->
    <!-- Tier 1: Base Terrace -->
    <path d="M 24 76 L 76 76 L 72 70 L 28 70 Z" fill="url(#bsGold)" fill-opacity="0.85" />
    
    <!-- Tier 2: Middle Terrace -->
    <path d="M 30 68 L 70 68 L 66 62 L 34 62 Z" fill="url(#bsGold)" fill-opacity="0.9" />
    
    <!-- Tier 3: Upper Circular Terrace -->
    <path d="M 36 60 L 64 60 L 60 54 L 40 54 Z" fill="url(#bsGold)" />

    <!-- Central Diamond & Spire (Ascending Career Pinnacle) -->
    <!-- Stupa Spire / Arrow Crown -->
    <path d="M 50 18 L 56 36 L 50 48 L 44 36 Z" fill="url(#bsGold)" />
    <!-- Stupa Crown Finial (Pinnacle) -->
    <circle cx="50" cy="18" r="3" fill="#FDE68A" />
    
    <!-- Stupa Flank Bells (Geometric representation) -->
    <circle cx="36" cy="48" r="4.5" fill="none" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="64" cy="48" r="4.5" fill="none" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="50" cy="48" r="5" fill="#FDE68A" />

    <!-- Career Elevation Rays -->
    <line x1="22" y1="50" x2="16" y2="50" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="78" y1="50" x2="84" y2="50" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
  </g>

  <!-- Typography Hierarchy -->
  <g transform="translate(126, 20)">
    <!-- Collaboration Eyebrow -->
    <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400E" letter-spacing="0.12em">
      UNTIDAR × SKANISA CAREER PORTAL
    </text>

    <!-- Main Title: BHUMI SAMBHARA -->
    <text x="0" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" font-weight="800" fill="#0F172A" letter-spacing="-0.03em">
      BHUMI SAMBHARA
    </text>

    <!-- Subtitle: EXPO & JOBFAIR 2026 -->
    <g transform="translate(0, 72)">
      <rect x="0" y="-14" width="220" height="20" rx="4" fill="#0F172A" />
      <text x="110" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#F59E0B" letter-spacing="0.18em" text-anchor="middle">
        EXPO &amp; JOBFAIR 2026
      </text>
    </g>
  </g>
</svg>
